name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Дозволи потрібні саме деплою Pages: записати артефакт і підтвердити особу раннера.
permissions:
  contents: read
  pages: write
  id-token: write

# Якщо пушів кілька підряд — доганяємо останнім, попередні скасовуємо.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          # 404.html Nuxt кладе сам: невідомий шлях GitHub віддає саме його,
          # і застосунок піднімається та розбирає URL сам.
          path: .output/public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
