  .boot__bg::after {
    content: '';
    position: absolute;
    inset: 0;
    background: rgb(16 18 22 / 46%);
  }

  .boot__body {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .boot__text {
    margin: 0;
    font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    font-size: 14px;
    color: #fff;
    text-shadow: 0 1px 16px rgb(0 0 0 / 60%);
  }

  .boot__dot {
    position: relative;
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: #f5a300;
    box-shadow: 0 6px 20px rgb(0 0 0 / 28%);
    animation:
      boot-kind 3.5s step-end infinite,
      boot-pop 0.7s cubic-bezier(0.32, 0.72, 0, 1) infinite;
  }

  @keyframes boot-kind {
    0% { background: #f5a300; }
    20% { background: #d32f28; }
    40% { background: #2563eb; }
    60% { background: #0aa63d; }
    80% { background: #c2189c; }
  }

  @keyframes boot-pop {
    0% { transform: scale(0.86); }
    40%, 100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .boot__dot {
      animation: none;
    }
  }
